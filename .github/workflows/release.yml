name: Release WidScore APK

# 100 % cloud : aucun SDK à installer sur PC.
# Tag v* poussé → GitHub compile l'APK debug → crée la Release avec l'APK dedans.
# Usage : git tag v1.4.0; git push origin v1.4.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner ubuntu-latest a déjà le SDK Android préinstallé
      # (setup-android@v3 cassé : package 'tools' inexistant).
      - name: Accept licenses + install platform 34
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # Pas de gradle wrapper commité dans le repo → on installe Gradle 8.7
      # (requis par Android Gradle Plugin 8.5.2) directement sur le runner.
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "WidScore-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" "WidScore-${GITHUB_REF_NAME}.apk"
          --title "WidScore $GITHUB_REF_NAME" --generate-notes
