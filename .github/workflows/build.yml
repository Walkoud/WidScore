name: Build WidScore APK

# 100 % cloud : aucun SDK à installer sur PC.
# Push sur main → GitHub compile l'APK debug → téléchargeable dans l'onglet Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Pas de gradle wrapper commité dans le repo → on installe Gradle 8.7
      # (requis par Android Gradle Plugin 8.5.2) directement sur le runner.
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WidScore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
